; pgBouncer configuration for connection pooling
; Connection pooling to prevent PostgreSQL connection exhaustion

[databases]
; Sellia production database
sellia = host=db.internal port=5432 dbname=sellia user=sellia_user password=sellia_pass

; Sellia analytics database (separate for heavy queries)
sellia_analytics = host=db-replica.internal port=5432 dbname=sellia_analytics user=sellia_user password=sellia_pass

[pgbouncer]
; =================================================================
; POOL MANAGEMENT
; =================================================================

; Mode: transaction (most common)
; - Connection returned to pool after each transaction
; - Lowest overhead, safest for most apps
pool_mode = transaction

; Maximum client connections (from app to pgBouncer)
max_client_conn = 1000

; Connection pool size (from pgBouncer to PostgreSQL)
default_pool_size = 25

; Minimum pool size (always keep connections open)
min_pool_size = 10

; Additional connections for high load
reserve_pool_size = 5
reserve_pool_timeout = 10

; =================================================================
; CONNECTION MANAGEMENT
; =================================================================

; Idle connection timeout (seconds)
; Close connections idle for this long
idle_in_transaction_session_timeout = 300  ; 5 min
server_idle_timeout = 600  ; 10 min

; Connection lifetime (rotate old connections)
server_lifetime = 3600  ; 1 hour
server_connect_timeout = 15

; Query timeout
query_timeout = 600  ; 10 min
query_wait_timeout = 300  ; 5 min (fail if can't get connection)

; =================================================================
; LOGGING & MONITORING
; =================================================================

; Log directory
logfile = /var/log/pgbouncer/pgbouncer.log

; Log level (debug, info, notice, warning, error)
loglevel = info

; Log connections/disconnections
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Statistics sampling interval
stats_period = 60

; =================================================================
; PERFORMANCE
; =================================================================

; Connection pooling algorithm
; LIFO = Last In First Out (reuse last connection)
server_round_robin = 0

; Disable Nagle's algorithm (reduce latency)
tcp_defer_accept = 1
tcp_keepalives = 1

; PKTBUF (buffer size, 4096 = default)
pkt_buf = 8192

; =================================================================
; AUTHENTICATION
; =================================================================

; Auth file (userlist.txt format: "username" "password")
auth_file = /etc/pgbouncer/userlist.txt

; Auth type
auth_type = md5

; =================================================================
; ADMIN
; =================================================================

; Admin socket for monitoring
admin_users = pgbouncer

; Listen addresses
listen_addr = *
listen_port = 6432

; Unix socket
unix_socket_dir = /var/run/pgbouncer
unix_socket_mode = 0777

; =================================================================
; ADVANCED
; =================================================================

; Replication mode
; application_name_add_host = 0

; Load balancing mode (default: none)
; load_balance_mode = random

; DNS cache TTL
dns_max_ttl = 15
dns_nxdomain_ttl = 15

; Disable online restart
online_mode = 1

; Auto database creation
auto_db = 0

; Ignore startup parameters
ignore_startup_parameters = extra_float_digits

; =================================================================
; TIMEOUTS & LIMITS
; =================================================================

; Login timeout (if client slow to send credentials)
login_timeout = 15

; Maximum requests before connection recycle
max_requests = 100000

; Maximum packet size
max_packet_size = 16777216  ; 16MB


; =================================================================
; MONITORING QUERIES
; =================================================================

; Check if server is alive (optional)
; server_check_query = "SELECT 1"
; server_check_delay = 10

; Pre-connect query
; server_lifetime = 3600


; =================================================================
; EXAMPLES & QUERIES
; =================================================================

; Connect to pgBouncer admin console:
;   psql -U pgbouncer -h localhost -p 6432 pgbouncer
;
; Useful admin commands:
;   SHOW POOLS;                    # Show pool statistics
;   SHOW CLIENTS;                  # Show connected clients
;   SHOW SERVERS;                  # Show server connections
;   SHOW CONFIG;                   # Show configuration
;   SHUTDOWN;                      # Graceful shutdown
;   RESUME;                        # Resume operations
;   SUSPEND;                       # Suspend operations
;   RELOAD;                        # Reload configuration
;   WAIT_CLOSE;                    # Wait for connections to close
;
; Monitoring from app:
;   SELECT datname, count(*) as connections FROM pg_stat_activity GROUP BY datname;
;   SELECT wait_event_type, count(*) FROM pg_stat_activity GROUP BY wait_event_type;
;
; Performance tuning:
;   - If max_client_conn hit: increase or restart app pool
;   - If query_wait_timeout increases: increase default_pool_size
;   - If server_idle_timeout hit: increase or add warmup queries
;   - Memory usage = max_client_conn * pkt_buf + more
