name: smoke-test

# Production uptime check against the REAL deployments:
#   backend  -> Railway (backend/railway.toml, healthcheckPath /api/health)
#   frontend -> Vercel  (sellia-brain project)
# The old version probed api.sellia.app / app.sellia.app, domains that were
# never configured (DNS doesn't resolve), so it failed on every run and
# emailed a failure ~96x/day. Override the URLs below via repo variables
# (Settings -> Variables) if/when custom domains are attached.

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'  # hourly; off the :00 mark to dodge scheduler congestion

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: ${{ vars.API_URL || 'https://sellia-production.up.railway.app' }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://sellia-brain.vercel.app/sellia-brain' }}
    steps:
      # --retry-all-errors + --retry-delay absorbs Railway cold starts and
      # transient network blips so only a sustained outage fails the run.
      - name: API health
        run: |
          status=$(curl -sS -L -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 15 --retry-all-errors \
            "$API_URL/api/health")
          if [[ "$status" != "200" ]]; then
            echo "::error::API /api/health returned $status ($API_URL)"
            exit 1
          fi
          echo "✓ api healthy"

      - name: Frontend home
        run: |
          status=$(curl -sS -L -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 15 --retry-all-errors \
            "$FRONTEND_URL")
          if [[ "$status" -lt 200 || "$status" -ge 400 ]]; then
            echo "::error::Frontend returned $status ($FRONTEND_URL)"
            exit 1
          fi
          echo "✓ frontend healthy"
