name: Secret guard

# Respaldo del hook .githooks/pre-commit: el hook sólo protege a quien lo tenga
# activado; esto corre para todos. Misma lógica (scripts/check-added-secrets.sh),
# sin acciones de terceros ni licencias. GitHub no ofrece "non-provider patterns"
# en este repo, que es lo que habría detectado una URL de base de datos con
# contraseña.
#
# Sólo mira las líneas que el cambio AGREGA: un PR que borra un secreto no falla.
# No analiza el historial (eso no se arregla con un check; se arregla rotando).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  added-lines:
    name: No credentials in added lines
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan added lines
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE_REF...HEAD"
          else
            # Un push nuevo, o un force-push cuyo "antes" ya no existe, no tiene
            # un rango comparable: no hay nada que comparar.
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              echo "Sin commit previo comparable; nada que escanear."
              exit 0
            fi
            RANGE="$BEFORE..$SHA"
          fi
          echo "Escaneando líneas agregadas en $RANGE"
          git diff -U0 --no-color "$RANGE" -- . ':!*.lock' ':!package-lock.json' | sh scripts/check-added-secrets.sh
