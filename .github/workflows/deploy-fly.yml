name: Deploy Backend to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FLY_API_TOKEN configured
        id: check_token
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::warning::FLY_API_TOKEN no configurado — Render es el target de deploy activo (ver ci.yml), salteo Fly.io."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Fly
        if: steps.check_token.outputs.configured == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly app (if needed)
        if: steps.check_token.outputs.configured == 'true'
        run: |
          cd backend
          flyctl apps create selliaai || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        if: steps.check_token.outputs.configured == 'true'
        run: |
          cd backend
          flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy status
        if: steps.check_token.outputs.configured == 'true'
        run: flyctl status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
