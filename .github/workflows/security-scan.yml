# ============================================================
#  OWASP ZAP Security Scan
#  Escaneo automatizado de vulnerabilidades en CI/CD
# ============================================================

name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Escaneo diario a las 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

# codeql-action/upload-sarif needs security-events: write to publish to the
# repo's Security tab — without an explicit permissions block the default
# GITHUB_TOKEN here was read-only, so the trivy job's upload step failed
# with "Resource not accessible by integration".
permissions:
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ---------------------------------------------------------------
  # 1. SAST con Semgrep (análisis estático)
  # ---------------------------------------------------------------
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    container:
      image: returntocorp/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # --baseline-commit needs the base commit's history

      # Diff-aware: only findings INTRODUCED by the change can fail the job.
      # The 36 ERROR findings that exist today were triaged on 2026-10-15 and are
      # all false positives (static DDL assembled from local constants, or
      # identifiers already validated by an allowlist/regex), so a full-tree gate
      # would only ever be red. Scheduled / manual runs have no base commit and stay
      # report-only.
      - name: Run Semgrep
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          # A new branch or a force-push reports an all-zero / unreachable "before".
          if [ -n "$BASE" ] && ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice::base commit $BASE is not reachable; running full-tree, report-only"
            BASE=""
          fi
          echo "SEMGREP_BASE=$BASE" >> "$GITHUB_ENV"

          semgrep --config=auto \
                  --config=p/owasp-top-ten \
                  --config=p/cwe-top-25 \
                  --config=p/security-audit \
                  ${BASE:+--baseline-commit "$BASE"} \
                  --json --output=semgrep-results.json \
                  backend/ frontend/src/ || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v6
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Fail on new critical findings
        run: |
          CRITICAL=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-results.json)
          if [ "$CRITICAL" -eq 0 ]; then
            echo "✅ No critical Semgrep findings"
          elif [ -n "$SEMGREP_BASE" ]; then
            echo "::error title=Semgrep::$CRITICAL new ERROR-severity finding(s) introduced by this change"
            jq -r '.results[] | select(.extra.severity == "ERROR") | "::error file=\(.path),line=\(.start.line),title=\(.check_id | split(".") | last)::\(.extra.message | gsub("\n"; " ") | .[0:300])"' semgrep-results.json
            exit 1
          else
            echo "::warning title=Semgrep::$CRITICAL ERROR-severity findings in the full tree (report-only run; see the artifact)"
          fi

  # ---------------------------------------------------------------
  # 2. Dependency check con Trivy
  # ---------------------------------------------------------------
  trivy:
    name: Trivy Dependency Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy on backend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'backend/requirements.txt'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy on frontend dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'frontend/package.json'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: actions/upload-artifact@v6
        with:
          name: trivy-results
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif

      - name: Upload to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'trivy-backend'

  # ---------------------------------------------------------------
  # 3. Python SAST with Bandit
  # ---------------------------------------------------------------
  bandit:
    name: Bandit Python SAST
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -r backend/app/ -f json -o bandit-results.json || true
          # Human-readable echo of the same scan, for the job log — bandit
          # exits non-zero on ANY finding (even LOW), so without `|| true`
          # this line alone killed the job before the real severity gate
          # below ever ran.
          bandit -r backend/app/ -f screen || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v6
        with:
          name: bandit-results
          path: bandit-results.json

      - name: Fail on high-severity findings
        run: |
          if [ -f "bandit-results.json" ]; then
            HIGH=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-results.json 2>/dev/null || echo "0")
            if [ "$HIGH" -gt 0 ]; then
              echo "❌ Found $HIGH high-severity Bandit findings"
              exit 1
            fi
          fi
          echo "✅ No high-severity Bandit findings"

  # ---------------------------------------------------------------
  # 4. Python Dependency Audit with pip-audit
  # ---------------------------------------------------------------
  pip-audit:
    name: pip-audit Dependency Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r backend/requirements.txt --format=json --output=pip-audit-results.json || true
          # Human-readable echo for the job log — pip-audit exits non-zero
          # on ANY finding, so without `|| true` this line alone killed the
          # job before the real severity gate below ever ran.
          pip-audit -r backend/requirements.txt --format=summary || true

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v6
        with:
          name: pip-audit-results
          path: pip-audit-results.json

      - name: Fail on critical vulnerabilities
        run: |
          if [ -f "pip-audit-results.json" ]; then
            CRITICAL=$(jq '[.dependencies[]?.vulns[]? | select(.fix_versions | length > 0)] | length' pip-audit-results.json 2>/dev/null || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "⚠️ Found $CRITICAL vulnerabilities with available fixes. Review the report."
            fi
          fi
          echo "✅ pip-audit completed"

  # ---------------------------------------------------------------
  # 5. OWASP ZAP Baseline Scan
  # ---------------------------------------------------------------
  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up environment
        run: |
          cp .env.example .env
          echo "SECRET_KEY=test-secret-key-for-zap-scan-$(openssl rand -hex 16)" >> .env
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sellia" >> .env
          echo "REDIS_URL=redis://redis:6379/0" >> .env
          echo "ENVIRONMENT=test" >> .env

      - name: Start application stack
        run: |
          docker compose -f docker-compose.yml up -d postgres redis backend frontend
          for i in {1..60}; do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "✅ Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 5
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false
          # Defaults to true, which has the action file/update a GitHub
          # issue with the scan results — that needs `issues: write`, which
          # this workflow's permissions block intentionally doesn't grant
          # (kept minimal: contents: read + security-events: write for the
          # Trivy SARIF upload). Confirmed failing: "Resource not accessible
          # by integration" on the issues API. Results are already available
          # via the uploaded report artifact below, so disable issue writing
          # instead of widening the token's scope for it.
          allow_issue_writing: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v6
        with:
          name: zap-baseline-report
          path: |
            report_*.html
            report_*.json

      - name: Check for high-risk findings
        run: |
          if [ -f "report_json.json" ]; then
            HIGH=$(jq '[.site[0].alerts[] | select(.riskdesc | startswith("High"))] | length' report_json.json 2>/dev/null || echo "0")
            if [ "$HIGH" -gt 0 ]; then
              echo "⚠️ Found $HIGH high-risk ZAP findings. Review the report."
            fi
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------
  # 6. OWASP ZAP Full Scan (escaneo profundo programado)
  # ---------------------------------------------------------------
  zap-full:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - name: Set up environment
        run: |
          cp .env.example .env
          echo "SECRET_KEY=test-secret-key-for-zap-scan-$(openssl rand -hex 16)" >> .env
          echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/sellia" >> .env
          echo "REDIS_URL=redis://redis:6379/0" >> .env
          echo "ENVIRONMENT=test" >> .env

      - name: Start application stack
        run: |
          docker compose -f docker-compose.yml up -d postgres redis backend frontend
          for i in {1..60}; do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "✅ Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 5
          done

      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: 'http://localhost:3000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false
          # Same reasoning as zap-baseline above: avoids "Resource not
          # accessible by integration" from the action's default GitHub
          # issue-writing, which needs issues: write that this workflow
          # intentionally doesn't grant.
          allow_issue_writing: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v6
        with:
          name: zap-full-report
          path: |
            report_*.html
            report_*.json

      - name: Check for high-risk findings
        run: |
          if [ -f "report_json.json" ]; then
            HIGH=$(jq '[.site[0].alerts[] | select(.riskdesc | startswith("High"))] | length' report_json.json 2>/dev/null || echo "0")
            if [ "$HIGH" -gt 0 ]; then
              echo "⚠️ Found $HIGH high-risk ZAP findings. Review the report."
            fi
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v
