name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_run:
    workflows: ['Build']
    branches: [main]
    types: [completed]

concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - uses: actions/checkout@v3

      - name: Deploy to staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          DEPLOY_HOST: staging.example.com
          DEPLOY_USER: deploy

        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST \
            "cd /app && git pull origin main && docker-compose up -d"

      - name: Run smoke tests
        run: |
          curl -f http://staging.example.com/health || exit 1
          echo "Staging deployment healthy"

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ Staging deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment*\n${{ github.sha }}\n${{ github.ref_name }}\n✅ All checks passed"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-production:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: production
    needs: []

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Verify tag
        run: |
          git tag -l
          git show ${{ github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: ./

      - name: Deploy frontend to CDN
        env:
          CDN_BUCKET: ${{ secrets.CDN_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        run: |
          tar -xzf frontend-build.tar.gz -C frontend/
          aws s3 sync frontend/.next s3://$CDN_BUCKET/.next --delete
          aws s3 sync frontend/public s3://$CDN_BUCKET/public --delete
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/*"

      - name: Deploy backend to production
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: api.production.com
          DEPLOY_USER: deploy

        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST \
            "cd /app && git fetch --all && git checkout ${{ github.ref_name }} && \
            docker-compose -f docker-compose.prod.yml pull && \
            docker-compose -f docker-compose.prod.yml up -d && \
            docker-compose exec -T backend alembic upgrade head"

      - name: Database migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

        run: |
          cd backend
          pip install -r requirements.txt
          alembic upgrade head

      - name: Verify production deployment
        run: |
          curl -f https://api.production.com/health || exit 1
          curl -f https://api.production.com/api/v1/analytics/dashboard/test || exit 1
          echo "Production deployment verified"

      - name: Publish release notes
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack deployment
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚀 Production Deployment",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Phase 26 Production Deploy*\nTag: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\n✅ Frontend ✅ Backend ✅ Migrations"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status*\nDeployed"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment*\nProduction"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  rollback:
    runs-on: ubuntu-latest
    if: failure() && startsWith(github.ref, 'refs/tags/')
    needs: [deploy-production]

    steps:
      - name: Rollback deployment
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: api.production.com
          DEPLOY_USER: deploy

        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST \
            "cd /app && git checkout main && docker-compose -f docker-compose.prod.yml up -d"

      - name: Notify Slack rollback
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "⚠️ Deployment Rollback",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed - Rolled Back*\nTag: ${{ github.ref_name }}\n⚠️ Reverted to main branch"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
