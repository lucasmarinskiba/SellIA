# Runners are pinned to ubuntu-24.04 in every workflow instead of `ubuntu-latest`:
# GitHub moves that label to Ubuntu 26 on 2026-10-19, and an unattended image
# change (e.g. `playwright install --with-deps` rejecting an unknown distro) is
# exactly the kind of thing that turns every workflow red overnight. Bump the
# pin on purpose, in one PR, and watch the first run.
name: CI - Tests & Build

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/1
          # tests/conftest.py overwrites DATABASE_URL/REDIS_URL with
          # docker-compose hostnames (db/redis) unless these are set.
          TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          TEST_REDIS_URL: redis://localhost:6379/1
          SECRET_KEY: github-actions-test-secret-key-32-chars-long
          ENVIRONMENT: testing
          ENABLE_OPENAPI: "false"
        run: |
          # Known-broken tests are quarantined (xfail) via tests/known_failures.txt,
          # and modules that cannot even be imported are skipped via collect_ignore
          # in tests/conftest.py — both are explicit, versioned lists with reasons.
          # Anything NOT on those lists that breaks (including a NEW collection
          # error) fails this step, so it protects against regressions again.
          # Coverage floor lives in backend/pytest.ini (--cov-fail-under, a ratchet).
          set -o pipefail
          pytest tests/ -v --tb=short --cov=app --cov-report=xml 2>&1 | tee pytest.log

      # This repo's GITHUB_TOKEN cannot read job logs (403), but ::error:: lines
      # DO show up in the check-run annotations, so surface what actually failed
      # instead of a bare "Process completed with exit code 1".
      - name: Surface test failures as annotations
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) |Required test coverage|^E   " pytest.log | head -25             | while IFS= read -r line; do echo "::error::${line:0:400}"; done

      # No Codecov upload: there is no CODECOV_TOKEN, so every upload failed with "Token
      # required - not valid tokenless upload" and `fail_ci_if_error: false` hid it. Coverage
      # is gated by --cov-fail-under in backend/pytest.ini. Re-add the step if a token is set.

      # ── Regenerar snapshot del cerebro (gen:brain) y verificar que esté al día ──
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Regenerar brain-graph (gen:brain)
        working-directory: frontend
        run: node scripts/gen-brain-graph.mjs

      - name: Verificar snapshot commiteado al día
        working-directory: .
        run: |
          git diff --exit-code -- frontend/src/data/brain-graph.json \
            || (echo "::error::brain-graph.json desactualizado — corré 'npm run gen:brain' y commiteá." && exit 1)

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-24.04
    # Two tiers (see backend/scripts/ruff_fatal_ratchet.py):
    #  - BLOCKING ratchet on the ruff rules that flag code that crashes at runtime
    #    (undefined names, syntax errors...). The 133 findings that existed on 2026-10-21 are
    #    baselined in backend/.ruff-fatal-baseline.json; only a NEW one fails the job.
    #  - ADVISORY full ruff run (~24k style findings) and black (~1330 files that do not
    #    match its formatting). They print their numbers but cannot fail the job, so a PR no
    #    longer shows a permanent red X that teaches everyone to ignore Backend Lint.
    # TODO: a dedicated, reviewed formatting pass, then gate on more rules.
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # ruff is pinned to the version the baseline was generated with: a different ruff
      # can change what these rules report and trip the ratchet with no code change.
      - name: Install ruff and black
        run: pip install ruff==0.16.5 black

      - name: Ruff - runtime-error rules (blocking ratchet)
        run: python scripts/ruff_fatal_ratchet.py

      - name: Ruff - full report (advisory)
        run: ruff check app/ --exit-zero --statistics | tail -n 8

      - name: Black - formatting report (advisory)
        run: black --check app/ 2>&1 | tail -n 2 || true

  frontend-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

  # ── Deploys ──────────────────────────────────────────────────────────────
  # CI no despliega nada. Hubo un job "Deploy Backend (Render)" que llamaba a un
  # webhook de Render, pero el secreto RENDER_DEPLOY_HOOK_URL nunca existió, así que
  # siempre salía por la rama "no configurado" y terminaba en verde sin desplegar:
  # un check que decía "deploy ok" sin que hubiera deploy. Se quitó para no engañar.
  #   - Backend:  Railway, auto-deploy desde main (healthcheck: backend/railway.toml).
  #   - Frontend: Vercel, auto-deploy desde main.
