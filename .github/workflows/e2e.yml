name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly at 3 AM UTC
    - cron: "0 3 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build service images
        run: |
          # NOT `cp .env.example .env`: docker compose substitutes ${VAR:-default}
          # from .env, and .env.example ships placeholders that override the
          # compose defaults and break the stack in two ways:
          #  - SECRET_KEY=your-secret-key-here is < 32 chars, so Settings() raises
          #    at import; the backend crashed while `uvicorn --reload` kept the
          #    container "Up" (=> backend/health=000NO_CONN forever).
          #  - POSTGRES_PASSWORD=secure_password_here, but "Seed test data" below
          #    connects as postgres:postgres.
          # These two values are all the compose file reads from .env.
          {
            echo "POSTGRES_PASSWORD=postgres"
            echo "SECRET_KEY=e2e-test-secret-key-$(openssl rand -hex 16)"
          } > .env
          # Split out from "Start services" below: that combined step's
          # only error signal was a bare "Process completed with exit code
          # 1" with no way to tell whether the cold image build, the
          # postgres/redis healthcheck gate, or the wait-on poll was what
          # actually failed/timed out — this repo's GITHUB_TOKEN can't read
          # job logs (403, confirmed repeatedly), so that ambiguity was a
          # dead end every time this step failed. A dedicated build step
          # gets its own clearly-named, independently-timed CI status.
          docker compose build postgres redis backend frontend

      - name: Start services
        run: |
          docker compose up -d postgres redis backend frontend
          # `up -d` blocks until postgres/redis pass their healthchecks
          # before backend/frontend even start (confirmed locally: ~70s on
          # a warm-image machine).
          #
          # Not wait-on: the "Diagnose failed startup" step below proved
          # (run 33671043664) that both services were already healthy —
          # backend/health=200, frontend=307, all containers "Up 5
          # minutes (healthy)" — at the exact moment wait-on gave up after
          # its full 300s budget. wait-on's http checker defaults to HEAD
          # requests; Next.js's dev server (this stack always runs `next
          # dev`, even via this same Dockerfile — see docker-compose.yml's
          # frontend command) doesn't necessarily answer HEAD the way it
          # answers GET, which plausibly explains wait-on never seeing it
          # as ready despite a plain GET (curl, or a real browser)
          # succeeding the whole time. security-scan.yml's ZAP jobs poll
          # the same stack with a plain curl retry loop and pass reliably
          # every run this session — reusing that proven mechanism here
          # instead of continuing to debug wait-on's HTTP semantics.
          # Budget is 600s (was 300s): the backend's lifespan startup runs every
          # bootstrap step and creates ~400 tables one transaction at a time on a
          # fresh database, and it does not accept connections until that finishes
          # (measured ~95s on a dev machine; a 2-vCPU runner is slower, so 300s left
          # no margin).
          for i in $(seq 1 120); do
            BACKEND_OK=false; FRONTEND_OK=false
            # Prefer /api/ready (schema bootstrap finished) when the backend exposes it:
            # /health can answer before the tables exist, and the seed step below needs
            # them. Backends without /api/ready (404) are ready once /health answers.
            # `|| true`: steps run under `bash -e`, and curl exits non-zero (7) while the
            # backend is still down, which would abort the whole step on the first poll.
            READY_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/ready || true)
            if [ "$READY_CODE" = "200" ]; then
              BACKEND_OK=true
            elif [ "$READY_CODE" = "404" ] && curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              BACKEND_OK=true
            fi
            curl -sf http://localhost:3000 > /dev/null 2>&1 && FRONTEND_OK=true
            if $BACKEND_OK && $FRONTEND_OK; then
              echo "✅ Both services ready after $((i * 5))s"
              exit 0
            fi
            echo "Waiting for services (backend=$BACKEND_OK frontend=$FRONTEND_OK)... ($i/120)"
            sleep 5
          done
          echo "::error::Services did not become ready within 600s"
          exit 1
          # (No env: block here — this step only runs `docker compose up`
          # and curl against the host-published ports; it doesn't read
          # DATABASE_URL/SECRET_KEY/etc. itself. Those belong on "Seed
          # test data" below, which actually imports app.core.config and
          # needs them — see that step's own env: block and its comment.)

      - name: Diagnose failed startup
        # Every previous "Start services" failure showed up here as a bare
        # "Process completed with exit code 1" — this repo's GITHUB_TOKEN
        # can't read job logs (403 "Must have admin rights to Repository",
        # confirmed repeatedly), so there was never any way to tell backend
        # crash-loop apart from frontend-still-compiling apart from
        # containers-never-starting. `::error::` lines DO show up in the
        # check-run annotations API (that access works, unlike raw logs),
        # so a compact one-liner here becomes the diagnostic signal for
        # next time instead of another blind guess.
        if: failure()
        run: |
          BACKEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8000/health || echo "NO_CONN")
          FRONTEND_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3000 || echo "NO_CONN")
          PS=$(docker compose ps --format '{{.Name}}={{.Status}}' | tr '\n' ' ')
          echo "::error::E2E startup failed | backend/health=$BACKEND_CODE frontend=$FRONTEND_CODE | $PS"
          # Tail of the backend log as an annotation too (annotations are readable via
          # the API; the ::group:: dumps below are not, this repo's token can't read logs).
          BTAIL=$(docker compose logs --no-color --tail=14 backend 2>&1 | tr '\n' '|' | cut -c1-1200)
          echo "::error::backend log tail: $BTAIL"
          echo "::group::docker compose ps (full)"
          docker compose ps
          echo "::endgroup::"
          echo "::group::backend logs (tail 80)"
          docker compose logs --tail=80 backend || true
          echo "::endgroup::"
          echo "::group::frontend logs (tail 80)"
          docker compose logs --tail=80 frontend || true
          echo "::endgroup::"

      - name: Seed test data
        run: |
          cd backend
          pip install -r requirements.txt
          python seed_data.py
        env:
          # This step runs on the runner itself (not inside a container),
          # importing app.core.config directly — DATABASE_URL has no
          # default there (required: str, by design — see config.py's
          # comment "no defaults allowed"), so without this the import of
          # app.core.database crashes immediately with a pydantic
          # ValidationError before seed_data.py does anything. Reproduced
          # locally: `env -i python seed_data.py` (no backend/.env, which
          # is gitignored — CI's fresh checkout never has one either)
          # fails with exactly "DATABASE_URL / Field required".
          #
          # postgres/sellia/postgres match docker-compose.yml's postgres
          # service defaults exactly (POSTGRES_USER, POSTGRES_DB, and
          # POSTGRES_PASSWORD's ${POSTGRES_PASSWORD:-postgres} fallback,
          # since this workflow never sets that var) — connecting via
          # localhost since docker-compose.yml publishes 5432 to the host.
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sellia
          SECRET_KEY: e2e-test-secret-32-chars-long-1234567
          ENVIRONMENT: testing

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down
