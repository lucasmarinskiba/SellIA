name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly at 3 AM UTC
    - cron: "0 3 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start services
        run: |
          cp .env.example .env || true
          docker compose up -d postgres redis backend frontend
          # Wait for services. `up -d` above already blocks until postgres/
          # redis pass their healthchecks before backend/frontend even
          # start (confirmed locally: ~70s on a warm-image machine), and on
          # a cold GitHub-hosted runner that step also has to pull/build
          # every image first. wait-on's clock only starts after `up -d`
          # returns, but 60s wasn't enough slack on top of that for the
          # frontend's first-request Turbopack compile — confirmed: this
          # step failed in CI (exit 1, no further detail available) right
          # after the frontend Docker build itself was fixed (alpine/musl
          # native-binding bug — see frontend/Dockerfile), so the build was
          # no longer the blocker, just the timeout budget. security-scan.
          # yml's ZAP jobs poll the same stack with a 300s budget (60
          # retries * 5s) and pass, which is the number this now matches.
          npx wait-on http://localhost:8000/health http://localhost:3000 --timeout 300000
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          SECRET_KEY: e2e-test-secret-32-chars-long-1234567
          ENVIRONMENT: testing
          REDIS_URL: redis://localhost:6379/0

      - name: Seed test data
        run: |
          cd backend
          pip install -r requirements.txt
          python seed_data.py

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --project=chromium
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down
