version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sellia
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # +asyncpg is required: app/core/database.py always calls
      # create_async_engine(), which raises immediately on a plain
      # postgresql:// (sync/psycopg2) URL — this backend has never been
      # able to boot via `docker compose up` with the old value.
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sellia
      REDIS_URL: redis://redis:6379
      API_ENV: ${API_ENV:-development}
      # SECRET_KEY has no default in app/core/config.py (required: str) —
      # pydantic-settings fails validation on boot without it. Dev-only
      # placeholder, override via a real SECRET_KEY env var for anything
      # beyond local/CI use.
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key-not-for-production-32ch}
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # This service's command overrides the Dockerfile's CMD to `npm run
      # dev`, so it never needs the final (production, --only=production)
      # stage — targeting `builder` instead gets a stage that already ran a
      # full `npm ci` (deps + devDependencies, including typescript/@types
      # that `next dev` needs for its TS project). Without this, the
      # production-stage node_modules is missing those, and `next dev`
      # silently npm-installs them itself on first request — ~3 minutes and
      # a full network fetch on every fresh container, which blew past
      # e2e.yml's `wait-on --timeout 60000`.
      target: builder
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # .next as its own anonymous volume, same reasoning as node_modules
      # above: without this, the bind mount puts Turbopack's dev build
      # output on the HOST filesystem. An interrupted/killed container
      # (a rebuild, `docker compose down` mid-compile, a host reboot) then
      # leaves partial manifest files behind that the next `next dev`
      # doesn't regenerate — reproduced locally as a persistent 500:
      # "Error: ENOENT ... .next/server/app/page/app-build-manifest.json".
      # Giving .next its own container-local volume means a fresh
      # container always gets a clean compile, matching how CI's e2e.yml/
      # security-scan.yml behave (ephemeral runner, no leftover .next).
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
